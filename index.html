<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구대로 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>구대로를 소개합니다</h1>
    <button id="theme-btn">🌙 다크모드</button>
  </header>

  <main class="cards">
    <!-- 카드 1 · 프로필 (4장에서 만든 카드) -->
    <article class="card">
      <img src="profile.jpg" alt="구대로 프로필 사진">
      <h2>구대로</h2>
      <p class="role">디지털금융 MBA</p>
      <p>카드사에서 데이터 분석을 맡고 있습니다.</p>
    </article>

    <!-- 카드 2 · 항목마다 이 블록을 복제해 채운다 -->
    <article class="card">
      <h2>관심 분야</h2>
      <p class="role">디지털금융MBA</p>
      <p>고객지표개발, 이탈고객분석, 체리피커 모형.</p>
    </article>

    <!-- 카드 3 -->
    <article class="card">
      <h2>이번 수업 목표</h2>
      <p class="role">무엇을 만들 것인가</p>
      <p>나만의 웹페이지 만들기.</p>
    </article>
  </main>

  <footer>
    <p>© 2026 구대로</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
